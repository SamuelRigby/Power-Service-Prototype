services:
  mongo:
    image: mongo:7
    networks:
      - internal
    volumes:
      - mongo_data:/data/db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      # A named volume with the default `local` driver lives on whichever node
      # the container lands on - it does not follow the container if Swarm
      # reschedules it elsewhere. Pinning mongo to a manager node keeps it
      # landing in the same place every time. Harmless no-op on the common
      # single-node `docker swarm init` setup (the only node already is the
      # manager); starts mattering once worker nodes are joined. Mongo is not
      # meant to be scaled past 1 replica - that would need a real replica set,
      # out of scope here - unlike backend/frontend below.
      placement:
        constraints:
          - node.role == manager

  backend:
    image: power-service-backend:latest
    networks:
      - internal
    environment:
      # The Compose service name above, not localhost - see CLAUDE.md.
      MONGO_URI: mongodb://mongo:27017
    secrets:
      - jwt_secret_key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    # Built with a different NEXT_PUBLIC_API_URL than docker-compose.yml's
    # frontend image, hence the distinct tag - see CLAUDE.md and README.md.
    image: power-service-frontend:swarm
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:1.27-alpine
    networks:
      - internal
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  internal:
    driver: overlay

volumes:
  mongo_data:

configs:
  nginx_conf:
    file: ./nginx/default.conf

secrets:
  # Created out-of-band via `docker secret create` before deploying - see
  # README.md - never written into this file or the repo.
  jwt_secret_key:
    external: true
