# Single entry point in front of the frontend and backend services (step 10).
# Swarm resolves each service name to a stable virtual IP that its own routing
# mesh load-balances across replicas, so a plain proxy_pass by service name -
# no `resolver`/upstream trickery - keeps working unchanged if backend or
# frontend is scaled to more than one replica. See CLAUDE.md for the full
# reasoning, including why proxy_pass deliberately has no trailing slash below
# (that's what makes nginx forward the full original path, e.g. /api/v1/...,
# instead of stripping the /api/ prefix before it reaches the backend).

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The mock SOAP meter-reading service (step 5) - mounted on the backend
    # app under /soap/, not part of the /api/v1 REST namespace.
    location /soap/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
